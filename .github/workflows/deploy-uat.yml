name: Deploy to UAT

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1 - Checkout the code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2 - Install SF CLI
      - name: Install SF CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      # Step 3 - Authenticate to UAT Sandbox
      - name: Authenticate to UAT Sandbox
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_UAT }}" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --alias demoUAT
          rm -f auth_url.txt

      # Step 4 - Deploy using package.xml
      - name: Deploy to UAT
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org demoUAT \
            --wait 30 \
            --ignore-conflicts

      # Step 5 - Report result
      - name: Deployment Complete
        run: echo "✅ Deploy_Test_Flow successfully deployed to UAT!"